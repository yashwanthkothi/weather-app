<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: 
        linear-gradient(rgba(0, 0, 0, 0.7), 
        rgba(0, 0, 0, 0.7)),
        url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }
    
    .card {
      background: rgba(45, 45, 45, 0.85);
      padding: 30px;
      border-radius: 15px;
      width: 300px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }
    
    h2 {
      color: #4fc3f7;
      margin-top: 0;
      font-size: 28px;
      border-bottom: 2px solid #4fc3f7;
      padding-bottom: 10px;
    }
    
    .temperature {
      font-size: 42px;
      font-weight: bold;
      color: #ffb74d;
      margin: 20px 0;
    }
    
    .unit {
      font-size: 24px;
      color: #e0e0e0;
    }
    
    .error {
      color: #ff5252;
      background: rgba(255, 82, 82, 0.1);
      padding: 10px;
      border-radius: 5px;
    }
    
    .weather-icon {
      font-size: 60px;
      margin: 15px 0;
      color: #bbdefb;
    }
  </style>
</head>
<body>
  <div class="card" id="weatherCard">
    <h2>London</h2>
    <div class="weather-icon">☁️</div>
    <div class="temperature">9.75<span class="unit">°C</span></div>
    <p>Cloudy with occasional showers</p>
  </div>
</body>
</html>
