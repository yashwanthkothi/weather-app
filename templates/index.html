<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
    .card { background: #2d2d2d; padding: 20px; border-radius: 8px; width: 250px; }
  </style>
</head>
<body>
  <div class="card" id="weatherCard">
    <h2>City: <span id="cityName"></span></h2>
    <p>Temperature: <span id="tempValue"></span>°C</p>
  </div>

  <script>
    // Simulated API response
    const data = {
      city: "London",
      temperature: 10.22
    };

    // Populate the UI
    document.getElementById('cityName').textContent = data.city;
    document.getElementById('tempValue').textContent = data.temperature;
  </script>
</body>
</html>
